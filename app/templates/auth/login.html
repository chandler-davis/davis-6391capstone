{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-user-lock fa-3x text-primary mb-3"></i>
                    <h2 class="card-title">Employee Login</h2>
                    <p class="text-muted">Access WNBA Draft System</p>
                </div>

                <form method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" name="username" id="username" required 
                                   placeholder="Enter your username" value="{{ request.form.username or '' }}">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" name="password" id="password" required 
                                   placeholder="Enter your password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>

                    <div class="text-center">
                        <p class="mb-0">Don't have an account?</p>
                        <a href="{{ url_for('auth.register') }}" class="text-decoration-none">
                            <i class="fas fa-user-plus me-1"></i>Register here
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Demo Credentials Card -->
        <div class="card mt-4 bg-light">
            <div class="card-body">
                <h6 class="card-title"><i class="fas fa-info-circle me-1"></i>Demo Credentials</h6>
                <div class="text-center">
                    <small class="text-muted">
                        <strong>Demo Login:</strong><br>
                        admin123 / scout123
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.card {
    border: none;
    border-radius: 15px;
}

.input-group-text {
    background: linear-gradient(45deg, var(--gcsu-blue), var(--gcsu-green));
    border: none;
    color: white;
}

.form-control:focus {
    border-color: var(--gcsu-blue);
    box-shadow: 0 0 0 0.2rem rgba(0, 51, 153, 0.25);
}
</style>
{% endblock %}
