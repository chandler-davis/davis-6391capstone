{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                    <h2 class="card-title">Employee Registration</h2>
                    <p class="text-muted">Join the WNBA Draft System</p>
                </div>

                <form method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" name="username" id="username" required 
                                   placeholder="Choose a username" value="{{ request.form.username or '' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control" name="email" id="email" required 
                                   placeholder="Enter your email" value="{{ request.form.email or '' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="role" class="form-label">Role</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-briefcase"></i></span>
                            <select class="form-select" name="role" id="role">
                                <option value="user" {% if request.form.role == 'user' %}selected{% endif %}>User</option>
                                <option value="scout" {% if request.form.role == 'scout' %}selected{% endif %}>Scout</option>
                                <option value="admin" {% if request.form.role == 'admin' %}selected{% endif %}>Admin</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" name="password" id="password" required 
                                   placeholder="Create a password" minlength="6">
                        </div>
                        <small class="form-text text-muted">Password must be at least 6 characters long.</small>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" name="confirm_password" id="confirm_password" required 
                                   placeholder="Confirm your password" minlength="6">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="fas fa-user-plus me-2"></i>Register
                    </button>

                    <div class="text-center">
                        <p class="mb-0">Already have an account?</p>
                        <a href="{{ url_for('auth.login') }}" class="text-decoration-none">
                            <i class="fas fa-sign-in-alt me-1"></i>Login here
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Role Information Card -->
        <div class="card mt-4 bg-light">
            <div class="card-body">
                <h6 class="card-title"><i class="fas fa-info-circle me-1"></i>Role Information</h6>
                <div class="row text-center">
                    <div class="col-4">
                        <span class="badge bg-secondary mb-1">User</span>
                        <br><small class="text-muted">View access only</small>
                    </div>
                    <div class="col-4">
                        <span class="badge bg-warning mb-1">Scout</span>
                        <br><small class="text-muted">Create reports & drafts</small>
                    </div>
                    <div class="col-4">
                        <span class="badge bg-danger mb-1">Admin</span>
                        <br><small class="text-muted">Full system access</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.card {
    border: none;
    border-radius: 15px;
}

.input-group-text {
    background: linear-gradient(45deg, var(--gcsu-blue), var(--gcsu-green));
    border: none;
    color: white;
}

.form-control:focus, .form-select:focus {
    border-color: var(--gcsu-blue);
    box-shadow: 0 0 0 0.2rem rgba(0, 51, 153, 0.25);
}

.form-select {
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23003399' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
}
</style>

<script>
// Password confirmation validation
document.getElementById('confirm_password').addEventListener('input', function() {
    const password = document.getElementById('password').value;
    const confirmPassword = this.value;
    
    if (password !== confirmPassword) {
        this.setCustomValidity('Passwords do not match');
    } else {
        this.setCustomValidity('');
    }
});
</script>
{% endblock %}
